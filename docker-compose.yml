services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: transcendence_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-transcendence}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcendence

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence_backend
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-transcendence}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      # Vide par défaut : autorise dynamiquement l'origine de chaque requête
      # (voir backend/src/common/cors.util.ts). Fixer une valeur en prod
      # pour restreindre à un domaine précis.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID}
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET}
      FORTYTWO_REDIRECT_URI: ${FORTYTWO_REDIRECT_URI:-https://localhost:3000/api/auth/42/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    command: npm run start:dev
    networks:
      - transcendence

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence_frontend
    environment:
      # Laissées vides par défaut : le frontend déduit alors l'URL de l'API
      # depuis l'origine du navigateur (voir frontend/src/services/api.ts),
      # ce qui marche aussi bien en localhost que depuis une IP du réseau
      # local. Ne fixer ces valeurs que si l'API vit sur un host différent.
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_WS_URL: ${VITE_WS_URL:-}
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
    command: npm run dev
    networks:
      - transcendence

  # nginx : point d'entrée HTTPS unique du site
  nginx:
    image: nginx:1.27-alpine
    container_name: transcendence_nginx
    ports:
      - "3000:3000"
      - "80:80" # HTTP : uniquement pour rediriger vers https://…:3000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - transcendence

volumes:
  postgres_data:
  backend_node_modules:
  backend_uploads:
  frontend_node_modules:

networks:
  transcendence:
    driver: bridge
