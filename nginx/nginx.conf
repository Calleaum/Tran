# Point d'entrée HTTPS unique du projet : https://localhost:3000
# nginx termine le TLS ici, puis parle en clair aux deux services internes
# (c'est autorisé : seule la connexion navigateur → serveur doit être en
# HTTPS, pas les connexions internes entre containers).
# Le port 80 (HTTP) n'est là que pour rediriger vers ce point d'entrée.
#
#   /api/*       → backend  (NestJS, préfixe /api retiré avant transmission)
#   /socket.io/* → backend  (Socket.IO, avec upgrade WebSocket)
#   tout le reste → frontend (Vite dev server, avec upgrade WebSocket pour le HMR)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Redirection HTTP → HTTPS ------------------------------------------
# Quiconque arrive en clair sur le port 80 (localhost ou IP du réseau
# local) est immédiatement redirigé vers la version HTTPS du site, seul
# point d'entrée valide (port 3000). $host ne contient jamais le port,
# d'où l'ajout explicite de ":3000" dans la cible de la redirection.
server {
    listen 80;
    server_name _;

    return 301 https://$host:3000$request_uri;
}

server {
    listen 3000 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    # --- API REST -----------------------------------------------------
    # /api/auth/login → backend:3001/auth/login (le préfixe /api est retiré
    # car les contrôleurs NestJS ne l'utilisent pas).
    location /api/ {
        proxy_pass http://backend:3001/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Socket.IO (jeu + chat) -----------------------------------------
    # Chemin conservé tel quel : le serveur Socket.IO écoute nativement sur
    # /socket.io/ côté backend, quel que soit le namespace utilisé.
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les sockets restent ouvertes longtemps : on évite les coupures
        # prématurées côté proxy.
        proxy_read_timeout 86400;
    }

    # --- Frontend ---------------------------------------------------------
    # Tout le reste (pages, assets, et le WebSocket de HMR de Vite) part
    # vers le serveur de dev Vite.
    location / {
        proxy_pass http://frontend:5173/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
